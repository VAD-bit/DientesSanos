<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa-icon.png" />
    <link rel="manifest" href="/manifest-admin.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Dientes Sanos CRM - Panel de administración y punto de venta." />
    <meta name="theme-color" content="#e9eae8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Dientes Sanos" />
    <link rel="preload" as="image" type="image/webp" href="/src/assets/admin_loading_bg.webp" media="(min-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="/src/assets/admin_loading_bg_mobile.webp" media="(max-width: 767px)" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <title>Dientes Sanos — Admin</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const isLocalDevelopment = ['localhost', '127.0.0.1'].includes(window.location.hostname);
      if ('serviceWorker' in navigator && !isLocalDevelopment) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw-admin.js', { scope: '/admin' }).catch(() => {});
        });
      } else if ('serviceWorker' in navigator && isLocalDevelopment) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
    </script>
  </body>
</html>
